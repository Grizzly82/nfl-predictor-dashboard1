[project]
name = "nfl-predictor-dashboard1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Cris Vizcaino", email = "cris.vizcaino@live.com" }
]
requires-python = ">=3.15"
dependencies = [
    "dash>=4.4.1",
    "dash-bootstrap-components>=2.0.4",
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "psycopg2-binary>=2.9.13",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
    "xgboost>=3.4.1",
]

[project.scripts]
nfl-predictor-dashboard1 = "nfl_predictor_dashboard1:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
